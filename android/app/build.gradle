plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader -> localProperties.load(reader) }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode', '1')
def flutterVersionName = localProperties.getProperty('flutter.versionName', '1.0')

android {
    namespace "com.pomac.lazo_client"
    compileSdkVersion 35

    defaultConfig {
        applicationId "com.pomac.lazo_client"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        // لتفادي مشكلة الـ MultiDex مع Hyperpay SDK
        multiDexEnabled true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }

    repositories {
        flatDir {
            dirs 'libs'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.0"
    implementation "androidx.core:core-ktx:1.12.0"
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    implementation 'androidx.multidex:multidex:2.0.1'

    // Hyperpay SDK
    implementation(name: 'oppwa.mobile-release', ext: 'aar')
    debugImplementation(name: 'ipworks3ds_sdk', ext: 'aar')
    releaseImplementation(name: 'ipworks3ds_sdk_deploy', ext: 'aar')

    // AndroidX & Google
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    implementation "androidx.browser:browser:1.8.0"
    implementation "androidx.fragment:fragment-ktx:1.8.6"
    implementation "androidx.constraintlayout:constraintlayout:2.2.1"
    implementation "androidx.webkit:webkit:1.13.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "com.google.code.gson:gson:2.11.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7"
}
